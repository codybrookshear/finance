# Locally: `make dev`. It writes the secrets from 1Password into files in a
# private RAM directory (scripts/secrets-write.sh), then runs compose with
# FINANCE_SECRETS_DIR pointing there.
#
# Secrets reach containers as files under /run/secrets (not environment
# variables), so they don't show up in `docker inspect` or process listings.
# They're file-backed because Compose can't inject environment-sourced secrets
# into read_only services.

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: finance_owner
      POSTGRES_DB: finance
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_owner_password
      TZ: America/Los_Angeles
    secrets: [postgres_owner_password, finance_sync_db_password, finance_web_db_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [db]            # internal only; no ports published
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "finance_owner", "-d", "finance"]
      interval: 5s
      retries: 20

  migrate:
    <<: *hardening
    build: { context: ., args: { CMD: migrate } }
    environment:
      PGHOST: postgres
      PGUSER: finance_owner
      PGDATABASE: finance
      PGSSLMODE: disable      # traffic never leaves the internal Docker network
      DB_PASSWORD_FILE: /run/secrets/postgres_owner_password
    secrets: [postgres_owner_password]
    networks: [db]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # One sync pass, then exit. In production a systemd timer runs
  # `docker compose run --rm sync` a few times a day.
  sync:
    <<: *hardening
    build: { context: ., args: { CMD: sync } }
    environment:
      PGHOST: postgres
      PGUSER: finance_sync
      PGDATABASE: finance
      PGSSLMODE: disable
      DB_PASSWORD_FILE: /run/secrets/finance_sync_db_password
      SIMPLEFIN_ACCESS_URL_FILE: /run/secrets/simplefin_access_url
      FINANCE_TZ: America/Los_Angeles
    secrets: [finance_sync_db_password, simplefin_access_url]
    networks: [db, egress]    # the only service allowed out to the internet
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: "no"

  # The UI: read-only database role, on the internal network only (no internet
  # access, no published port). How it's served is environment-specific:
  # compose.dev.yaml serves HTTP on the LAN; in production it will listen on
  # a Unix socket that cloudflared on the host connects to (WEB_SOCKET).
  web:
    <<: *hardening
    build: { context: ., args: { CMD: web } }
    environment:
      PGHOST: postgres
      PGUSER: finance_web
      PGDATABASE: finance
      PGSSLMODE: disable
      DB_PASSWORD_FILE: /run/secrets/finance_web_db_password
      FINANCE_TZ: America/Los_Angeles
    secrets: [finance_web_db_password]
    networks: [db]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

networks:
  db:
    internal: true            # no route to the internet
  egress: {}

volumes:
  pgdata: {}

secrets:
  postgres_owner_password:
    file: ${FINANCE_SECRETS_DIR:?set FINANCE_SECRETS_DIR (see make dev)}/postgres_owner_password
  finance_sync_db_password:
    file: ${FINANCE_SECRETS_DIR:?}/finance_sync_db_password
  finance_web_db_password:
    file: ${FINANCE_SECRETS_DIR:?}/finance_web_db_password
  simplefin_access_url:
    file: ${FINANCE_SECRETS_DIR:?}/simplefin_access_url
