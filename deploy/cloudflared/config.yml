# cloudflared config for the droplet. scripts/tunnel-deploy.sh installs it as
# /etc/cloudflared/config.yml.
#
# Locally-managed tunnel: this file, not the Cloudflare dashboard, decides what
# the tunnel can reach. Nothing here is secret. The tunnel credentials live in
# 1Password and systemd hands them to the service (see cloudflared.service).
#
# Fill in the REPLACE_ME values from scripts/tunnel-create.sh and the Access
# app (deploy/cloudflared/README.md); the deploy script refuses to run until
# they're filled in.

tunnel: a1a032df-e5b2-425f-915b-07d6b345c6c5

# Health/metrics listener, loopback only (the install script checks /ready).
metrics: 127.0.0.1:20241
# Don't serve pprof/metrics over Cloudflare's remote management channel.
management-diagnostics: false

ingress:
  # SSH. Cloudflare Access checks identity at the edge. The `access` block makes
  # cloudflared ALSO verify the Access JWT (signature, expiry, audience) before
  # it opens a connection to sshd, so a deleted/misconfigured Access app, or a
  # second hostname routed to this tunnel, can't expose sshd.
  - hostname: ssh.brookshear.party
    service: ssh://127.0.0.1:22
    originRequest:
      access:
        required: true
        teamName: brookshear       # <team>.cloudflareaccess.com
        # Access app → Application Audience (AUD) tag
        audTag: [52b07270a638969df4be4ed96cd4cfeb3b36c5963d45b8059a97d7c8c0cc4a05]

  # The web UI: the web container's Unix socket (see compose.prod.yaml). The
  # app checks the Access JWT too; this makes cloudflared refuse first.
  - hostname: finance.brookshear.party
    service: unix:/run/finance-web/web.sock
    originRequest:
      access:
        required: true
        teamName: brookshear       # <team>.cloudflareaccess.com
        # Access app for finance.brookshear.party → Application Audience (AUD) tag
        audTag: [b377e7a1a9610f5cdcee7a0e963246fcc766318ca878d025f34aa117626aa53c]

  # The hockey sites (codybrookshear/hockey), which share this droplet: the
  # rink's schedule and the RHL league's stats, public data, so they're the
  # only rules WITHOUT Cloudflare Access, by choice. Their containers have no
  # secrets and no route to finance's containers (their own Compose project
  # and networks); each serves its socket.
  - hostname: hockey.brookshear.party
    service: unix:/run/hockey-web/web.sock
  - hostname: rhl.brookshear.party
    service: unix:/run/rhl-web/web.sock

  # Anything else, including hostnames not listed above.
  - service: http_status:404
