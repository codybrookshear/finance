# Production overrides, on the droplet (/opt/finance; its .env selects this
# file). Images are built on the workstation from a committed revision and
# loaded over SSH by scripts/deploy.sh, so nothing is built here and the
# only image pulled from a registry is the digest-pinned Postgres.
services:
  migrate:
    build: !reset null
    image: finance-migrate:${FINANCE_VERSION:?}
    pull_policy: never
  sync:
    build: !reset null
    image: finance-sync:${FINANCE_VERSION:?}
    pull_policy: never
  # Serves a Unix socket in /run/finance-web for cloudflared (on the host) and
  # checks the Cloudflare Access login on every request, against signing keys
  # the finance-access-keys timer keeps in /etc/finance/access.
  web:
    build: !reset null
    image: finance-web:${FINANCE_VERSION:?}
    pull_policy: never
    environment:
      WEB_SOCKET: /run/web/web.sock
      ACCESS_TEAM_DOMAIN: brookshear.cloudflareaccess.com
      # The Access app's AUD tag. Not secret: Access puts it in every login redirect.
      ACCESS_AUD: b377e7a1a9610f5cdcee7a0e963246fcc766318ca878d025f34aa117626aa53c  # gitleaks:allow
      ACCESS_ALLOWED_EMAILS: you@example.com
      ACCESS_CERTS_FILE: /run/access/certs.json
    volumes:
      - /run/finance-web:/run/web
      - /etc/finance/access:/run/access:ro
