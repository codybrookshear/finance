{{define "layout.html" -}}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<!-- htmx: no eval, no inline styles, and no history snapshots in localStorage
     (they would keep financial data on the device). -->
<meta name="htmx-config" content='{"allowEval":false,"allowScriptTags":false,"includeIndicatorStyles":false,"historyCacheSize":0,"refreshOnHistoryMiss":true,"selfRequestsOnly":true}'>
<title>BB</title>
<link rel="icon" href="{{asset "icon.svg"}}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{asset "icon-180.png"}}">
<!-- Fetched with the login cookie: without it, Cloudflare Access would
     answer the manifest request with its login page. -->
<link rel="manifest" href="{{asset "manifest.webmanifest"}}" crossorigin="use-credentials">
<meta name="apple-mobile-web-app-title" content="BB">
<meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0a09" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="{{asset "app.css"}}">
<link rel="stylesheet" href="/categories.css">
{{- block "head" .}}{{end}}
</head>
<body>
<header class="top">
  <nav>
    <a class="logo" href="/transactions" aria-label="BB: transactions"><img src="{{asset "icon.svg"}}" alt="" width="30" height="30"></a>
    <a href="/transactions"{{if eq .Page "transactions"}} aria-current="page"{{end}}>Transactions</a>
    <a href="/spending"{{if eq .Page "spending"}} aria-current="page"{{end}}>Spending</a>
    <a href="/accounts"{{if eq .Page "accounts"}} aria-current="page"{{end}}>Accounts</a>
  </nav>
</header>
<main>
{{template "content" .}}
</main>
<footer>{{.Email}} · last sync {{stamp .LastSync}}{{with .NextSync}} · {{.}}{{end}}</footer>
{{- block "scripts" .}}{{end}}
<script src="{{asset "app.js"}}"></script>
</body>
</html>
{{end}}
